# Publicador excepcional, únicamente para Batman v30. Retirarlo tras publicar.
name: Publicar Batman v30 una sola vez
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publicar_batman_v30_una_vez.yml']

permissions:
  contents: write

concurrency:
  group: publicacion-publica-batman
  cancel-in-progress: false

jobs:
  publicar:
    if: github.ref == 'refs/heads/main' && github.actor == 'grupolea2022-sudo'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Validar APK v30 contra v29 antes de publicar
        env:
          SOURCE: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-72e4-81f5-8236-96f41960cb7e/raw?se=2026-11-02T16%3A06%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=e57f1a02-4c84-5150-ad76-b68dc2446e9c&skoid=78501c7f-f65d-4e8d-9110-bed29e1beb41&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-02T13%3A11%3A15Z&ske=2026-11-03T13%3A11%3A15Z&sks=b&skv=2026-02-06&sig=c7d4zYLyL%2BsdXSKU7uMZ2v8rcA8Z7LOh7Yoa44Wg5Ow%3D"
          APK_SHA: "a413ee5a9a5072429037b2a7c9e7709b19c1e4095a28f1c1f689d7611be533a6"
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/actualizaciones:refs/remotes/origin/actualizaciones
          PUBLICADA=$(git show refs/remotes/origin/actualizaciones:version.json | python3 -c 'import json,sys;print(json.load(sys.stdin)["n"])')
          if [[ "$PUBLICADA" == "30" ]]; then echo "v30 publicada; no repetir"; exit 0; fi
          [[ "$PUBLICADA" == "29" ]] || { echo "STOP: se esperaba v29, existe v$PUBLICADA"; exit 1; }
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 20 --max-time 95 "$SOURCE" -o "$RUNNER_TEMP/v30.zip"
          unzip -p "$RUNNER_TEMP/v30.zip" app-debug.apk > "$RUNNER_TEMP/v30.apk"
          test -s "$RUNNER_TEMP/v30.apk"
          echo "$APK_SHA  $RUNNER_TEMP/v30.apk" | sha256sum -c -
          APT="$ANDROID_HOME/build-tools/35.0.0"
          if [[ ! -x "$APT/apksigner" || ! -x "$APT/aapt" ]]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          fi
          "$APT/apksigner" verify --print-certs "$RUNNER_TEMP/v30.apk"
          "$APT/aapt" dump badging "$RUNNER_TEMP/v30.apk" | grep -F "package: name='com.nex0.tumascotacontigo' versionCode='30'"
          git show refs/remotes/origin/actualizaciones:TuMascotaContigo-29.apk > "$RUNNER_TEMP/v29.apk"
          "$APT/apksigner" verify --print-certs "$RUNNER_TEMP/v29.apk"
          OLD=$("$APT/apksigner" verify --print-certs "$RUNNER_TEMP/v29.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          NEW=$("$APT/apksigner" verify --print-certs "$RUNNER_TEMP/v30.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          [[ -n "$OLD" && "$OLD" == "$NEW" ]] || { echo "STOP: firma incompatible con v29"; exit 1; }
          git worktree add --detach "$RUNNER_TEMP/publicacion30" refs/remotes/origin/actualizaciones
          DIR="$RUNNER_TEMP/publicacion30"
          test ! -e "$DIR/TuMascotaContigo-30.apk" || { echo "STOP: versión 30 ya existe"; exit 1; }
          cp "$RUNNER_TEMP/v30.apk" "$DIR/TuMascotaContigo-30.apk"
          cp "$RUNNER_TEMP/v30.apk" "$DIR/TuMascotaContigo.apk"
          printf '%s  %s\n' "$APK_SHA" "TuMascotaContigo-30.apk" > "$DIR/TuMascotaContigo-30.sha256.txt"
          printf '%s\n' '{"n":30,"url":"https://raw.githubusercontent.com/grupolea2022-sudo/tu-mascota-contigo/actualizaciones/TuMascotaContigo-30.apk"}' > "$DIR/version.json"
          git -C "$DIR" config user.name "batman-v30-autorizado"
          git -C "$DIR" config user.email "actions@users.noreply.github.com"
          git -C "$DIR" add -- TuMascotaContigo-30.apk TuMascotaContigo.apk TuMascotaContigo-30.sha256.txt version.json
          git -C "$DIR" commit -m "Publicar Batman v30: fondo de rescate con botones visibles"
          git -C "$DIR" push origin HEAD:refs/heads/actualizaciones
          echo "PUBLICADO Batman v30 por el canal de actualización existente"
