# Excepcional, solamente Batman v29. Retirar después de publicar.
name: Publicar Batman v29 una sola vez
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publicar_batman_v29_una_vez.yml']

permissions:
  contents: write

concurrency:
  group: publicacion-publica-batman
  cancel-in-progress: false

jobs:
  publicar:
    if: github.ref == 'refs/heads/main' && github.actor == 'grupolea2022-sudo'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verificar huella, firma y paquete antes de distribuir v29
        env:
          SOURCE: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-0170-81f5-a8b8-7b94cc65b1bc/raw?se=2026-11-02T15%3A45%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=3277fffd-b844-5ef2-b5b9-c318d0843063&skoid=78501c7f-f65d-4e8d-9110-bed29e1beb41&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-01T22%3A52%3A51Z&ske=2026-11-02T22%3A52%3A51Z&sks=b&skv=2026-02-06&sig=CMNtyDOQufc/hJ6Ij%2BEo1y3X5QAhwsoLaFElQfZem3M%3D"
          APK_SHA: "62b407ee4fce852d6af0dc7de23e8e23b1c14a340b51a2b92ca8e59e137249f6"
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/actualizaciones:refs/remotes/origin/actualizaciones
          PUBLICADA=$(git show refs/remotes/origin/actualizaciones:version.json | python3 -c 'import json,sys;print(json.load(sys.stdin)["n"])')
          if [[ "$PUBLICADA" == "29" ]]; then echo 'Batman v29 ya publicada; no repetir'; exit 0; fi
          [[ "$PUBLICADA" == "28" ]] || { echo "STOP: se esperaba v28, hay $PUBLICADA"; exit 1; }
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 20 --max-time 90 "$SOURCE" -o "$RUNNER_TEMP/v29.zip"
          unzip -p "$RUNNER_TEMP/v29.zip" app-debug.apk > "$RUNNER_TEMP/v29.apk"
          test -s "$RUNNER_TEMP/v29.apk"
          echo "$APK_SHA  $RUNNER_TEMP/v29.apk" | sha256sum -c -
          APT="$ANDROID_HOME/build-tools/35.0.0"
          if [[ ! -x "$APT/apksigner" || ! -x "$APT/aapt" ]]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          fi
          "$APT/apksigner" verify --print-certs "$RUNNER_TEMP/v29.apk"
          "$APT/aapt" dump badging "$RUNNER_TEMP/v29.apk" | grep -F "package: name='com.nex0.tumascotacontigo' versionCode='29'"
          git show refs/remotes/origin/actualizaciones:TuMascotaContigo-28.apk > "$RUNNER_TEMP/v28.apk"
          "$APT/apksigner" verify --print-certs "$RUNNER_TEMP/v28.apk"
          OLD=$("$APT/apksigner" verify --print-certs "$RUNNER_TEMP/v28.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          NEW=$("$APT/apksigner" verify --print-certs "$RUNNER_TEMP/v29.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          [[ -n "$OLD" && "$OLD" == "$NEW" ]] || { echo "STOP: v29 no coincide con firma v28"; exit 1; }
          git worktree add --detach "$RUNNER_TEMP/publicacion-v29" refs/remotes/origin/actualizaciones
          DIR="$RUNNER_TEMP/publicacion-v29"
          test ! -e "$DIR/TuMascotaContigo-29.apk" || { echo "STOP: ya existe v29"; exit 1; }
          cp "$RUNNER_TEMP/v29.apk" "$DIR/TuMascotaContigo-29.apk"
          cp "$RUNNER_TEMP/v29.apk" "$DIR/TuMascotaContigo.apk"
          printf '%s  %s\n' "$APK_SHA" "TuMascotaContigo-29.apk" > "$DIR/TuMascotaContigo-29.sha256.txt"
          printf '%s\n' '{"n":29,"url":"https://raw.githubusercontent.com/grupolea2022-sudo/tu-mascota-contigo/actualizaciones/TuMascotaContigo-29.apk"}' > "$DIR/version.json"
          git -C "$DIR" config user.name "batman-v29-autorizado"
          git -C "$DIR" config user.email "actions@users.noreply.github.com"
          git -C "$DIR" add -- TuMascotaContigo-29.apk TuMascotaContigo.apk TuMascotaContigo-29.sha256.txt version.json
          git -C "$DIR" commit -m "Publicar Batman v29: mensaje libre y rescate sin notificaciones"
          git -C "$DIR" push origin HEAD:refs/heads/actualizaciones
          echo "PUBLICADO Batman v29 por canal existente, sin cambiar fondos automáticamente"
